<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#0f172a" rx="14"/>
  <text x="40" y="44" fill="#f1f5f9" font-size="18px" font-weight="700">Dietary-constraint compliance by model</text>
  <text x="40" y="66" fill="#94a3b8" font-size="13px">Higher is better &#183; sorted low to high</text>

  <!-- gridlines at 25/50/75/100 -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="120" y1="340" x2="690" y2="340"/>
    <line x1="120" y1="268" x2="690" y2="268"/>
    <line x1="120" y1="196" x2="690" y2="196"/>
    <line x1="120" y1="124" x2="690" y2="124"/>
  </g>
  <g fill="#475569" font-size="10px" font-family="ui-monospace,Menlo,monospace" text-anchor="end">
    <text x="112" y="344">0</text>
    <text x="112" y="272">25</text>
    <text x="112" y="200">50</text>
    <text x="112" y="128">75</text>
    <text x="112" y="60">100</text>
  </g>

  <!-- scale: y for value v = 340 - (v/100)*288 ; bottom 340 top 52 -->
  <!-- base Llama 54.92 -> 340 - 158.2 = 181.8 -->
  <rect x="150" y="182" width="90" height="158" fill="#475569" rx="4"/>
  <text x="195" y="172" fill="#cbd5e1" font-size="15px" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">54.92%</text>
  <text x="195" y="362" fill="#e2e8f0" font-size="12px" text-anchor="middle">base Llama</text>

  <!-- GPT-4o 56.79 -> 340 - 163.5 = 176.5 -->
  <rect x="290" y="177" width="90" height="163" fill="#64748b" rx="4"/>
  <text x="335" y="167" fill="#cbd5e1" font-size="15px" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">56.79%</text>
  <text x="335" y="362" fill="#e2e8f0" font-size="12px" text-anchor="middle">GPT-4o</text>

  <!-- DPO 72.02 -> 340 - 207.4 = 132.6 -->
  <rect x="430" y="133" width="90" height="207" fill="#0e7490" rx="4"/>
  <text x="475" y="123" fill="#67e8f9" font-size="15px" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">72.02%</text>
  <text x="475" y="362" fill="#e2e8f0" font-size="12px" text-anchor="middle">DPO</text>

  <!-- SFT 99.69 -> 340 - 287.1 = 52.9 -->
  <rect x="570" y="53" width="90" height="287" fill="#f59e0b" rx="4"/>
  <text x="615" y="43" fill="#fcd34d" font-size="15px" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">99.69%</text>
  <text x="615" y="362" fill="#fde68a" font-size="12px" font-weight="700" text-anchor="middle">SFT</text>

  <text x="40" y="400" fill="#64748b" font-size="11px">SFT sits in a different tier &#8212; and at ~$8 training cost. DPO improved on base but degraded relative to SFT.</text>
</svg>
