<svg viewBox="0 0 620 490" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="620" height="490" fill="#0f172a" rx="14"/>
  <text x="40" y="42" fill="#f1f5f9" font-size="18px" font-weight="700">Where reward models live</text>
  <text x="40" y="63" fill="#94a3b8" font-size="13px">Bias-variance, and which failures weak-to-strong tolerates</text>

  <!-- quadrant box -->
  <rect x="120" y="100" width="380" height="320" fill="#0b1220" stroke="#1e293b" stroke-width="1.5" rx="8"/>
  <!-- mid lines -->
  <line x1="310" y1="100" x2="310" y2="420" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="120" y1="260" x2="500" y2="260" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- axis labels -->
  <text x="310" y="446" fill="#94a3b8" font-size="12px" text-anchor="middle">bias  &#8594;</text>
  <text x="205" y="446" fill="#64748b" font-size="11px" text-anchor="middle">low</text>
  <text x="415" y="446" fill="#64748b" font-size="11px" text-anchor="middle">high</text>
  <text x="86" y="264" fill="#94a3b8" font-size="12px" text-anchor="middle" transform="rotate(-90 86 264)">variance  &#8594;</text>
  <text x="104" y="190" fill="#64748b" font-size="11px" text-anchor="middle" transform="rotate(-90 104 190)">high</text>
  <text x="104" y="345" fill="#64748b" font-size="11px" text-anchor="middle" transform="rotate(-90 104 345)">low</text>

  <!-- human labelers: high variance, low bias -> top-left -->
  <circle cx="205" cy="180" r="13" fill="#10b981"/>
  <text x="225" y="176" fill="#e2e8f0" font-size="13px" font-weight="700">Human labelers</text>
  <text x="225" y="193" fill="#94a3b8" font-size="11px">high variance, low bias</text>
  <text x="225" y="208" fill="#34d399" font-size="10.5px">scattered noise &#8212; recoverable</text>

  <!-- XGBoost: low variance, high bias -> bottom-right; label above dot -->
  <circle cx="455" cy="360" r="13" fill="#f59e0b"/>
  <text x="455" y="312" fill="#e2e8f0" font-size="13px" font-weight="700" text-anchor="middle">XGBoost classifier</text>
  <text x="455" y="329" fill="#94a3b8" font-size="11px" text-anchor="middle">low variance, high bias</text>
  <text x="455" y="344" fill="#fbbf24" font-size="10.5px" text-anchor="middle">systematic &#8212; student locks on</text>

  <!-- ideal: low variance, low bias -> bottom-left -->
  <circle cx="205" cy="345" r="11" fill="#38bdf8"/>
  <text x="225" y="342" fill="#e2e8f0" font-size="13px" font-weight="700">Ideal reward model</text>
  <text x="225" y="359" fill="#94a3b8" font-size="11px">low variance, low bias</text>

  <text x="40" y="478" fill="#64748b" font-size="11px">The danger isn't inaccuracy &#8212; it's whether errors are noise to average away or bias to absorb.</text>
</svg>
